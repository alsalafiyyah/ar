title: "Alsalafiyyah"
email: alsalafiyyah@icloud.com
description: >- # this means to ignore newlines until "baseurl:"
  Saying of the Salaf and scholars
baseurl: "/fawaid" 
url: "/" 
permalink           : pretty
markdown            : kramdown
paginate            : 10
paginate_path       : "/:num/"

# Build settings
remote_theme: alsalafiyyah/alsalafiyyah.github.io
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-paginate

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

include:
  - _pages

defaults:
  # _posts
  - scope:
      path: "_posts/**"
      type: posts
    values:
      layout: post
      permalink: /:title/