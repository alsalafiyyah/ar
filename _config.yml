title: "السّلفيّة"
email: alsalafiyyah@icloud.com
description: >- # this means to ignore newlines until "baseurl:"
  Saying of the Salaf and scholars
baseurl: "/ar" 
url: "/" 
markdown            : kramdown
paginate            : 4
paginate_path       : "/fatwas/:num/"

categories_select: false

# Menu Navigation
menu_navigation:
  - title: "فتاوى"
    url: "https://alsalafiyyah.github.io/fatwas/"
  - title: "صوتيات"
    url: "https://alsalafiyyah.github.io/audios/"
  - title: "مرئيات"
    url: "https://alsalafiyyah.github.io/videos/"
  - title: "مقالات"
    url: "https://alsalafiyyah.github.io/muqolat/"
  - title: "القرآن الكريم"
    url: "https://alsalafiyyah.github.io/quran/"

# Footer Navigation
footer_navigation:
  - title: "انستقرام"
    url: "https://instagram.com/alsalafiyyah"
  - title: "عن الموقع"
    url: "https://alsalafiyyah.github.io/about/"
  - title: English
    url: "https://alsalafiyyah.github.io/"

# Site Elements
site_elements:
  published: "تاريخ النشر"
  next: "التالي"
  prev: "السابق"
  last_modified: "آخر تحديث للموقع بتاريخ"
  share: "مشاركة"
  source: "المصدر"
  categories: "التصنيفات"
  translator: "مترجم"
  latest_posts: "أحدث الفتاوى"
  selected_post: "الفتاوى المختارة"
  recent_posts: "Recent Fatwas"
  read_more: "Read"
  view_all_posts: "تصفح الفتاوى"
  classified_under: "التصنيفات"
  taken_from: "Taken From"
  search: "بحث"
  select_category: "Select Category"
  scholars: "العلماء"
  scholar: "العلماء"
  footer_slogan: "منهج السلف الصالح"
  related_fatwas: "فتاوى ذات صلة"
  most_read: "الأكثر قراءة"
  home: "الرئيسية"
  subscribe_newsletter: "اشترك في نشرتنا البريدية"
  dir: "rtl"
  lang: "ar"
  telegram: "تليجرام"
  translation: "Read in English"

# Build settings
remote_theme: alsalafiyyah/alsalafiyyah.github.io
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-paginate

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

include:
  - _pages

collections:
  categories:
    output: true

defaults:
  # _posts
  - scope:
      path: "_posts/**"
      type: posts
    values:
      layout: post
      permalink: /:title/
  # _posts/audios/
  - scope:
      path: "_posts/audios/**"
      type: posts
    values:
      layout: post
      active: audios
      permalink: /audios/:title/
  # _posts/videos/    
  - scope:
      path: "_posts/videos/**"
      type: posts
    values:
      layout: post
      active: videos
      permalink: /videos/:title/
  # _categories
  - scope:
      path: "_categories"
      type: "categories"
    values:
      layout: "category"
      permalink: /category/:title/ 

permalink: pretty
