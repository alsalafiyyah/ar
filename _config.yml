title: "Alsalafiyyah"
email: alsalafiyyah@icloud.com
description: >- # this means to ignore newlines until "baseurl:"
  Saying of the Salaf and scholars
baseurl: "/fawaid" 
url: "/" 
permalink           : pretty
markdown            : kramdown
paginate            : 4
paginate_path       : "/:num/"

# Menu Navigation
menu_navigation:
  - title: Fatwas
    url: /fatwas/
  - title: Audios
    url: /audios/
  - title: Videos
    url: /videos/
  - title: Muqolat
    url: /muqolat/
  - title: "al-Qur'an"
    url: "/quran/"

# Footer Navigation
footer_navigation:
  - title: Instagram
    url: "https://instagram.com/alsalafiyyah"
  - title: About
    url: /about/
  - title: RSS
    url: /feed/

# Site Elements
site_elements:
  published: "Published"
  next: "Newer"
  prev: "Older"
  last_modified: "Last Modified"
  share: "Spread"
  source: "Source"
  categories: "Categories"
  translator: "Translator"
  latest_posts: "Latest Insights"
  selected_post: "Selected Fatwas"
  recent_posts: "Recent Fatwas"
  read_more: "Read"
  view_all_posts: "View All Fatwas"
  classified_under: "Classified Under"
  taken_from: "Taken From"
  search: "Search"
  select_category: "Select Category"
  scholars: "Scholars"
  scholar: "Scholar"

# Build settings
remote_theme: alsalafiyyah/alsalafiyyah.github.io
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-paginate

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

include:
  - _pages

defaults:
  # _posts
  - scope:
      path: "_posts/**"
      type: posts
    values:
      layout: post
      permalink: /:title/