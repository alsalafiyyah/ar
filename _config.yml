# Build settings
remote_theme: alsalafiyyah/alsalafiyyah.github.io
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-paginate

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

include:
  - _pages

collections:
  categories:
    output: true
  tag:
    output: true

defaults:
  # _posts
  - scope:
      path: "_posts/**"
      type: posts
    values:
      layout: post
      permalink: /:title/
  # _posts/audios/
  - scope:
      path: "_posts/audios/**"
      type: posts
    values:
      layout: post
      active: audios
      permalink: /audios/:title/
  # _posts/videos/    
  - scope:
      path: "_posts/videos/**"
      type: posts
    values:
      layout: post
      active: videos
      permalink: /videos/:title/
  # _categories
  - scope:
      path: "_categories"
      type: "categories"
    values:
      layout: "category"
      permalink: /category/:title/ 
  # _tag
  - scope:
      path: "_tag"
      type: "tag"
    values:
      layout: "tag"
      permalink: /scholars/:title/

permalink: pretty
